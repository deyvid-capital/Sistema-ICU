services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        entrypoint: ["/bin/sh", "-c", "chmod -R ug+rwx /var/www/html/storage /var/www/html/bootstrap/cache && exec /usr/local/bin/start-container"]
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - 'sail-puppeteer:/home/sail/.cache/puppeteer'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    worker:
        image: 'sail-8.5/app'
        # Corre como root (igual que laravel.test, cuyo WWWUSER está vacío) para poder
        # fijar el mtime de las vistas Blade compiladas (touch requiere ser dueño del archivo).
        # HOME=/home/sail permite que BrowsershotPdfFactory encuentre Chrome vía getenv('HOME').
        entrypoint: ["php", "/var/www/html/artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--backoff=5", "--max-time=3600", "--max-jobs=500"]
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            HOME: /home/sail
        volumes:
            - '.:/var/www/html'
            - 'sail-puppeteer:/home/sail/.cache/puppeteer'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        restart: unless-stopped
        mem_limit: 768m
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-puppeteer:
        driver: local
