services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        # Docker crea /home/sail/.cache como root al montar sail-puppeteer; sin el
        # chown, corepack (pnpm) y Composer no pueden escribir su caché.
        # storage/ y bootstrap/cache/ se reasignan a sail en cada arranque porque cualquier
        # `docker exec` como root deja carpetas root:root donde PHP (sail) no puede escribir.
        # El setgid (2775) en storage/app/public hace que lo nuevo herede el grupo sail.
        # Se usa $WWWUSER y no `sail` porque este script corre antes del `usermod -u` de
        # start-container: en ese momento `sail` aún tiene el UID 1337 de la imagen.
        entrypoint: ["/bin/sh", "-c", "chown $$WWWUSER:sail /home/sail/.cache && mkdir -p /var/www/html/storage/app/public && chown -R $$WWWUSER:sail /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R ug+rwX /var/www/html/storage /var/www/html/bootstrap/cache && find /var/www/html/storage/app/public -type d -exec chmod 2775 {} + && exec /usr/local/bin/start-container"]
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - 'sail-puppeteer:/home/sail/.cache/puppeteer'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    worker:
        image: 'sail-8.5/app'
        # Debe correr como `sail` (WWWUSER), no como root: Filament Exports escribe
        # en storage/app/private/filament_exports con permisos 0700 del dueño del proceso.
        # Si el worker es root, el PHP-FPM (sail) no puede leer el .xlsx y la descarga
        # responde 404. HOME=/home/sail permite a Browsershot localizar Chrome.
        # Antes de arrancar se corrigen dueño y permisos de storage/ (ver laravel.test);
        # el "--" ocupa $0 para que `command` llegue íntegro a start-container vía "$@".
        entrypoint: ["/bin/sh", "-c", "mkdir -p /var/www/html/storage/app/public && chown -R $$WWWUSER:sail /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R ug+rwX /var/www/html/storage /var/www/html/bootstrap/cache && find /var/www/html/storage/app/public -type d -exec chmod 2775 {} + && exec /usr/local/bin/start-container \"$$@\"", "--"]
        command:
            - php
            - /var/www/html/artisan
            - queue:work
            - redis
            - --sleep=3
            - --tries=3
            - --backoff=5
            - --max-time=3600
            - --max-jobs=500
        environment:
            WWWUSER: '${WWWUSER}'
            SUPERVISOR_PHP_USER: sail
            LARAVEL_SAIL: 1
            HOME: /home/sail
        volumes:
            - '.:/var/www/html'
            - 'sail-puppeteer:/home/sail/.cache/puppeteer'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        restart: unless-stopped
        mem_limit: 768m
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    firmador:
        # Firma PDF con pyHanko (docker/firmador). Sin puertos publicados: solo
        # laravel.test y worker lo alcanzan por la red interna (http://firmador:8000).
        # Raíz de solo lectura; /tmp en memoria para los uploads que FastAPI vuelca a disco.
        build:
            context: ./docker/firmador
        image: 'icu-firmador'
        environment:
            FIRMADOR_TOKEN: '${FIRMADOR_TOKEN}'
        read_only: true
        tmpfs:
            - /tmp
        networks:
            - sail
        restart: unless-stopped
        mem_limit: 512m
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-puppeteer:
        driver: local
